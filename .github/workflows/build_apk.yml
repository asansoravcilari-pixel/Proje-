name: Build Spectre APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Proje Iskeletini Dogrudan Olustur
        run: |
          # Mevcut dosyalara dokunmadan eksik android klasörünü projeye uygun üretir
          flutter create . --platforms=android --org=com.spectre.mobile
          
          # Android internet ve HTTP (cleartext) iznini Manifest'e ekle
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"><uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml
          
          flutter pub get

      - name: APK Derle (Debug)
        run: flutter build apk --debug --verbose

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Mobile-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
