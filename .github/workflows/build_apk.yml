name: Build Spectre APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Telefondan butona basıp istediğin zaman derleme başlatabilmek için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Paketleri Indir
        run: flutter pub get

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: APK'yi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
