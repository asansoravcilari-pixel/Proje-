name: Build Spectre APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Proje Iskeletini Temiz Kur
        run: |
          # Android altyapısını eksiksiz oluştur
          flutter create . --project-name=spectre_mobile --platforms=android --org=com.spectre.mobile --overwrite
          
          # HTTP ve Internet iznini bozmadan ekleyen Python scripti
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
          if "usesCleartextTraffic" not in content:
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          flutter pub get

      - name: APK Derle (Debug)
        run: flutter build apk --debug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Mobile-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
