name: Build Spectre APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android Proje İskeletini Tamamla
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.spectre.mobile
          fi
          flutter pub add http

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
